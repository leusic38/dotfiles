# Le compte lit le Maildir local, pas l'IMAP : c'est mbsync qui parle au
# serveur. Consequence voulue — aerc et le compteur de la barre voient
# exactement la meme chose, et aerc fonctionne hors ligne.

[perso]
source   = maildir://~/.local/share/mail/perso
default  = INBOX
from     = Emmanuel Farcis <emmanuel@farcis.fr>
outgoing = msmtp -a perso
copy-to  = Sent
postpone = Drafts
