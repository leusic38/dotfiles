# Apparence et rendu. Les raccourcis ne sont pas redefinis : aerc retombe
# sur /usr/share/aerc/binds.conf, qui convient tel quel.

[ui]
threading-enabled=true
sort=-r date
timestamp-format=2006-01-02 15:04

[viewer]
pager=less -Rc
alternatives=text/plain,text/html

[filters]
# Sur Arch, les filtres sont installes sous /usr/lib/aerc/ — /usr/share/aerc/
# ne contient que les configurations par defaut (aerc.conf, accounts.conf,
# binds.conf), pas les filtres. Piege facile, verifie avec `pacman -Ql aerc`.
text/plain=/usr/lib/aerc/filters/colorize
text/html=/usr/lib/aerc/filters/html
